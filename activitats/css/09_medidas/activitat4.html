<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto Resaltado</title>
    <style>
        body {
            font-family: "Georgia", serif;
            background-color: #f4f4f4;
            margin: 20px;
            padding: 20px;
        }
        .texto {
            font-size: 1.2rem;
            text-align: justify;
            line-height: 1.6;
        }
        .subrayado {
            background-color: rgba(255, 255, 0, 0.5); /* Fondo amarillo semitransparente */
            padding: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p class="texto">
        La historia de <strong class="subrayado">Moby Dick</strong> nos habla de la obsesión del capitán Ahab por capturar a la gran ballena blanca. 
        Su deseo de venganza lo lleva a enfrentarse a las profundidades del mar, en una lucha que desafía los límites de la razón y la naturaleza.
    </p>
</body>
</html>
