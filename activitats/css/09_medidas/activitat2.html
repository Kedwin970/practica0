<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavadora Dual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
            padding: 20px;
        }
        .parrafo {
            background-color: coral;
            padding: 10px;
            margin: 10px 0;
        }
        .parrafo:nth-child(1) { width: 100%; }
        .parrafo:nth-child(2) { width: 90%; }
        .parrafo:nth-child(3) { width: 80%; }
        .parrafo:nth-child(4) { width: 70%; }
        .parrafo:nth-child(5) { width: 60%; }
    </style>
</head>
<body>
    <p class="parrafo">Este es el primer párrafo de texto con un color de fondo.</p>
    <p class="parrafo">Este es el segundo párrafo con un ancho menor.</p>
    <p class="parrafo">Aquí va el tercer párrafo, aún más estrecho.</p>
    <p class="parrafo">El cuarto párrafo continúa reduciendo su anchura.</p>
    <p class="parrafo">Finalmente, el quinto párrafo tiene el menor ancho.</p>
</body>
</html>
