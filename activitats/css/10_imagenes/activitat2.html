<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Contacto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        main {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('https://source.unsplash.com/1600x900/?technology') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        section {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav ul li {
            margin: 10px 0;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            background: #007bff;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            transition: background 0.3s ease;
        }

        nav ul li a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<main>
    <section>
        <h1>Kedwin Duran</h1>
        <p>Estudiant Desarrollador Web </p>
        <nav>
            <ul>
                <li><a href="#">📄 Curriculum.kedwin</a></li>
                <li><a href="#">🐦 Twitter</a></li>
                <li><a href="#">📘 LinkedIn:Kedwindanielduran@gmail.com</a></li>
                <li><a href="#">📷 Instagram:k.duran.7</a></li>
                <li><a href="#">✉️ Email:kedwindanielduran@gmail.com</a></li>
                <li><a href="#">🌎 Mi Web:KD web</a></li>
            </ul>
        </nav>
    </section>
</main>

</body>
</html>
