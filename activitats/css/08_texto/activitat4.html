<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Sitio</title>
    <style>
        @font-face {
            font-family: "TituloFont";
            src: url("fonts/TituloFont.woff2") format("woff2");
            font-display: swap;
        }
        
        @font-face {
            font-family: "TextoFont";
            src: url("fonts/TextoFont.woff2") format("woff2");
            font-display: swap;
        }
        
        body {
            font-family: "TextoFont", serif;
            background-color: #f4f4f4;
            margin: 20px;
            padding: 20px;
        }
        .titulo {
            font-size: 3rem;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            letter-spacing: 0.3rem;
            font-family: "TituloFont", sans-serif;
        }
        .titulo:hover {
            font-style: italic;
            color: blue;
        }
        .contenido {
            font-size: 1.2rem;
            font-weight: normal;
            font-style: normal;
            text-align: justify;
            line-height: 1.6;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1 class="titulo">KD WEB</h1>
    <p class="contenido">
        La creatividad es el alma de la innovación. Cada idea, por pequeña que sea, tiene el potencial de transformar el mundo. No subestimes el poder de un pensamiento original.
    </p>
</body>
</html>
